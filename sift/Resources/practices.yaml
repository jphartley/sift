    best_for:
      - scattered attention
      - mild anxiety
      - wanting a clean and simple rhythm
    keywords:
      - equal
      - breathing
      - steady
      - focus
      - calm
      - balance
    summary: A balanced breath practice where the inhale and exhale are the same length.
    steps:
      - Choose a comfortable count, such as 4.
      - Inhale through your nose for that count.
      - Exhale through your nose or mouth for the same count.
      - Keep the rhythm smooth and unforced.
      - Continue for 3-5 minutes.
    why_it_helps: Matching the inhale and exhale gives the mind a clean rhythm to follow without adding strain.
    duration_minutes: 4
    intensity: low
    avoid_when:
      - feeling dizzy
      - driving

  - id: counting-the-breath
    name: Counting the Breath
    category: Breathwork
    labels:
      - focus
      - meditation
      - rumination
      - calm
      - low-effort
    best_for:
      - repetitive thoughts
      - settling before meditation
      - needing a gentle attention anchor
    keywords:
      - count
      - breath
      - thinking
      - racing
      - focus
      - meditation
    summary: A quiet breath practice that uses counting to gather wandering attention.
    steps:
      - Sit comfortably and let your breath be natural.
      - Count one on the first exhale.
      - Count up to ten, one exhale at a time.
      - When you lose count, gently begin again at one.
      - Continue without trying to make the breath perfect.
    why_it_helps: Counting gives busy thoughts a simple job, making it easier to return without fighting the mind.
    duration_minutes: 5
    intensity: low
    avoid_when:
      - driving

  - id: one-minute-breath-reset
    name: One-Minute Breath Reset
    category: Breathwork
    labels:
      - quick-reset
      - transition
      - low-effort
      - calm
      - practical
    best_for:
      - between meetings
      - before answering a message
      - when you only have a minute
    keywords:
      - reset
      - quick
      - minute
      - meeting
      - message
      - pause
    summary: A tiny breath pause for changing gears without making a ceremony of it.
    steps:
      - Pause what you are doing.
      - Let your jaw and shoulders soften slightly.
      - Take five slow, comfortable breaths.
      - Make each exhale a little easier than the last.
      - Name the next thing you are going to do.
    why_it_helps: A short pause can create just enough space between stimulus and response to choose your next move.
    duration_minutes: 1
    intensity: low
    avoid_when:
      - driving

  - id: sighing-practice
