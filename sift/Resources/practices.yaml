  - id: wim-hof-style-breathing
    name: Wim Hof-Style Breathing
    category: Breathwork
    labels:
      - energizing
      - high-intensity
      - resilience
      - body-awareness
      - activation
    best_for:
      - experienced breathwork sessions
      - wanting a strong state shift
      - feeling ready for an intense practice
    keywords:
      - wim hof
      - intense breath
      - energizing
      - breath hold
      - cold
      - activation
    summary: A strong cyclic breathing practice with a brief breath hold, for experienced users only.
    steps:
      - Sit or lie down in a safe place, never in water or while driving.
      - Take 20-30 fuller breaths at a steady pace.
      - After the last exhale, pause and hold the breath out only as long as comfortable.
      - Inhale, hold gently for a few seconds, then release.
      - Rest with normal breathing and stop after one round if it feels like enough.
    why_it_helps: Strong cyclic breathing can create a clear state shift, but it asks for respect and should be approached carefully.
    duration_minutes: 10
    intensity: high
    avoid_when:
      - in water
      - driving
      - standing
      - pregnancy
      - feeling dizzy
      - acute panic
      - cardiovascular concerns
      - seizure history

  - id: shoulder-drop-breathing
    name: Shoulder-Drop Breathing
    category: Breathwork
    labels:
      - tension-release
      - body-awareness
      - low-effort
      - workday
