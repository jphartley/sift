      - wanting something simple
      - needing to soften without counting too much
    keywords:
      - exhale
      - anxious
      - calm
      - stress
      - soften
      - breathing
    summary: A simple practice of making each exhale a little longer than each inhale.
    steps:
      - Breathe normally for a few breaths.
      - Inhale gently for a comfortable count.
      - Exhale for one or two counts longer than the inhale.
      - Keep the breath easy rather than forced.
      - Continue for 3-5 minutes.
    why_it_helps: Lengthening the exhale can cue a slower rhythm without needing a complicated technique.
    duration_minutes: 4
    intensity: low
    avoid_when:
      - feeling dizzy
      - short of breath
      - driving

  - id: three-part-yogic-breath
    name: Three-Part Yogic Breath
    category: Breathwork
    labels:
      - body-awareness
      - yoga
      - grounding
      - calm
      - spaciousness
    best_for:
      - shallow breathing
      - feeling disconnected from your body
      - easing into a slower state
    keywords:
      - belly
      - ribs
      - chest
      - yoga
      - breath
      - shallow
    summary: A spacious breath that moves attention through the belly, ribs, and chest.
    steps:
      - Sit or lie down with one hand on your belly and one on your chest.
      - Inhale first into the belly.
      - Let the inhale expand into the ribs.
      - Let the top of the inhale gently lift the chest.
      - Exhale slowly from chest, ribs, then belly.
      - Repeat for several easy rounds.
    why_it_helps: Moving attention through the body can make the breath feel less cramped and bring you back into physical presence.
    duration_minutes: 5
    intensity: low
    avoid_when:
      - feeling dizzy
      - short of breath

  - id: equal-breathing
    name: Equal Breathing
    category: Breathwork
    labels:
      - focus
