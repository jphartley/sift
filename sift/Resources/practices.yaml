      - emotional swirl
      - seeing patterns without getting lost in them
    keywords:
      - noting
      - thinking
      - feeling
      - rumination
      - label
      - mindfulness
    summary: A meditation that gently labels what is happening as it happens.
    steps:
      - Sit comfortably and notice what is most obvious.
      - Silently label it with one word, such as "thinking," "hearing," or "tightness."
      - Let the experience continue or pass.
      - Label the next thing that becomes obvious.
      - Keep the labels light, like touching a bell.
    why_it_helps: Naming experience can create a little space between awareness and the thing you are noticing.
    duration_minutes: 10
    intensity: medium
    avoid_when:
