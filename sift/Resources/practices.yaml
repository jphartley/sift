practices:
  - id: box-breathing
    name: Box Breathing
    category: Breathwork
    labels:
      - calm
      - anxiety
      - quick-reset
      - structured
      - low-effort
    best_for:
      - racing thoughts
      - feeling physically keyed up
      - needing composure before a hard moment
    keywords:
      - breath
      - breathing
      - anxious
      - stress
      - calm
      - nervous
      - panic
    summary: A steady four-part breathing pattern for settling yourself when things feel fast or loud.
    steps:
      - Sit upright or stand with your feet grounded.
      - Inhale through your nose for 4 seconds.
      - Hold gently for 4 seconds.
      - Exhale slowly for 4 seconds.
      - Hold empty for 4 seconds.
      - Repeat for 4-6 rounds, then breathe normally.
    why_it_helps: The predictable rhythm gives your attention somewhere reliable to land, which can make the next few minutes feel more manageable.
    duration_minutes: 3
    intensity: low
    avoid_when:
      - feeling dizzy
      - driving

  - id: 478-breathing
    name: 4-7-8 Breathing
    category: Breathwork
    labels:
      - sleep
      - wind-down
      - calm
      - anxiety
      - evening
    best_for:
      - winding down before sleep
      - restless evenings
      - feeling tense after a long day
    keywords:
      - sleep
      - tired
      - restless
      - wired
      - can't sleep
      - wind down
      - breathing
    summary: A slow breath pattern with a long exhale for easing into rest.
    steps:
      - Sit or lie down somewhere comfortable.
      - Inhale quietly through your nose for 4 seconds.
      - Hold the breath gently for 7 seconds.
      - Exhale slowly through your mouth for 8 seconds.
      - Repeat for 3-5 rounds.
      - Let your breathing return to normal before standing up.
    why_it_helps: The long exhale and repeated count can help your body shift toward a quieter pace.
    duration_minutes: 3
    intensity: low
    avoid_when:
      - feeling dizzy
      - short of breath
      - driving

  - id: physiological-sigh
    name: Physiological Sigh
    category: Breathwork
    labels:
      - quick-reset
      - tension-release
      - anxiety
      - nervous-system
      - low-effort
    best_for:
      - sudden stress
      - a tight chest
      - needing a reset in under a minute
    keywords:
      - stress
      - sigh
      - anxious
      - tight chest
      - overwhelmed
      - reset
    summary: A quick two-inhale breath followed by a long exhale.
    steps:
      - Take a comfortable inhale through your nose.
      - Before exhaling, sip in a little more air.
      - Let the breath out slowly through your mouth.
      - Pause for a moment and notice what changed.
      - Repeat 2-5 times.
    why_it_helps: A fuller inhale followed by a long exhale can release held tension and interrupt a stress spiral quickly.
    duration_minutes: 1
    intensity: low
    avoid_when:
      - feeling dizzy
      - driving

  - id: alternate-nostril-breathing
    name: Alternate Nostril Breathing
    category: Breathwork
    labels:
      - balance
      - focus
      - calm
      - yoga
      - contemplative
    best_for:
      - feeling scattered
      - preparing to meditate
      - wanting a slow ritualized breath practice
    keywords:
      - nostril
      - breathing
      - scattered
      - balance
      - focus
      - yoga
    summary: A gentle yogic breathing practice that alternates the breath between nostrils.
    steps:
      - Sit comfortably and soften your shoulders.
      - Close your right nostril and inhale through your left.
      - Close your left nostril and exhale through your right.
      - Inhale through your right nostril.
      - Close your right nostril and exhale through your left.
      - Continue slowly for 3-5 minutes.
    why_it_helps: The pattern asks for just enough attention to gather the mind while the slow breath supports steadiness.
    duration_minutes: 5
    intensity: low
    avoid_when:
      - congested
      - feeling dizzy
      - driving

  - id: extended-exhale-breathing
    name: Extended Exhale Breathing
    category: Breathwork
    labels:
      - calm
      - anxiety
      - simple
      - low-effort
      - nervous-system
    best_for:
