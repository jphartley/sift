      - frustrated
      - heavy
      - exhale
    summary: A simple practice of letting out several honest, audible sighs.
    steps:
      - Find a place where making a little sound feels okay.
      - Take a natural inhale.
      - Let the exhale come out as a sigh.
      - Repeat several times without performing it.
      - After the last sigh, sit quietly for a few normal breaths.
    why_it_helps: Sighing gives the body permission to release effort that may have been held unconsciously.
