    summary: A slow walking practice that uses each step as a meditation object.
    steps:
      - Choose a short path where you can walk safely.
      - Walk more slowly than usual.
      - Feel one foot lift, move, and land.
      - Turn around when you reach the end of the path.
      - Let each step bring you back.
    why_it_helps: Walking gives restless energy somewhere to go while keeping attention close to direct sensation.
