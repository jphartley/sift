    keywords:
      - shoulders
      - neck
      - tension
      - desk
      - bracing
      - tight
    summary: A breath practice that pairs each exhale with releasing the shoulders, jaw, and hands.
    steps:
      - Sit or stand where you are.
      - Inhale and notice your shoulders.
      - Exhale and let them drop a little.
      - On the next exhale, soften your jaw.
      - On the next exhale, loosen your hands.
      - Continue for 1-3 minutes.
    why_it_helps: Pairing breath with small physical releases can reveal where you are bracing and invite the body to spend less effort.
    duration_minutes: 3
    intensity: low
    avoid_when:
      - driving

