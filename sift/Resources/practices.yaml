      - compassion
      - lonely
      - self criticism
      - kindness
    summary: A compassion meditation using simple phrases of goodwill.
    steps:
      - Sit quietly and bring yourself to mind.
      - Offer a phrase such as "May I be safe" or "May I be at ease."
      - Repeat the phrase slowly, letting it be sincere enough.
      - Bring to mind someone you care about and offer the same wish.
      - If it feels right, include someone neutral or difficult.
    why_it_helps: Repeating goodwill phrases can make warmth more available when the mind has narrowed around threat or criticism.
    duration_minutes: 12
    intensity: medium
    avoid_when:
