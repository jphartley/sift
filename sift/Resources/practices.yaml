  - id: rain-meditation
    name: RAIN Meditation
    category: Meditation
    labels:
      - emotional-processing
      - self-compassion
      - mindfulness
      - acceptance
      - inquiry
    best_for:
      - difficult emotions
      - shame or self-judgment
      - wanting to meet what is here kindly
    keywords:
      - rain
      - emotion
      - difficult
      - shame
      - self compassion
      - overwhelmed
    summary: A mindful emotional practice using Recognize, Allow, Investigate, and Nurture.
    steps:
      - Recognize what emotion or pattern is present.
      - Allow it to be here for now, without approving or fixing it.
      - Investigate gently where it lives in the body and what it needs.
      - Nurture yourself with one kind phrase or gesture.
      - Rest for a few breaths before moving on.
    why_it_helps: RAIN offers a clear path for staying with emotion without collapsing into it or pushing it away.
    duration_minutes: 15
    intensity: medium
    avoid_when:
      - feeling emotionally flooded
      - needing immediate external support

